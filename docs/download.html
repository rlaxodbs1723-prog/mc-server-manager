<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>다운로드 - MC CubePanel</title>
<meta name="description" content="MC CubePanel 받기. 윈도우·맥에서 보안 경고가 뜰 때 어떻게 하는지 알려 드려요." />
<link rel="canonical" href="https://cubepanel.kr/download" />
<meta name="robots" content="noindex" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<style>
  :root {
    --bg: #101013; --surface: #1b1d23; --surface-2: #23262e; --line: #2d313a;
    --text: #f2f3f5; --text-2: #b0b6c0; --text-3: #7d8591;
    --primary: #3182f6; --primary-2: #1f6fe0; --green: #35d07f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Pretendard Variable', Pretendard, system-ui, 'Malgun Gothic', 'Microsoft YaHei', sans-serif; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px; }
  header.top { border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; align-items: center; gap: 10px; height: 60px; }
  header.top a.home { display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700; }
  header.top img { width: 28px; height: 28px; }
  .langs { margin-left: auto; display: flex; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .langs button { font: inherit; font-size: 12px; background: none; border: 0; color: var(--text-3); padding: 4px 8px; border-radius: 6px; cursor: pointer; }
  .langs button.on { background: var(--surface-2); color: var(--text); }
  .hero { text-align: center; padding: 56px 0 28px; }
  .hero .ok { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center; background: rgba(53, 208, 127, 0.14); color: var(--green); }
  .hero .ok svg { width: 28px; height: 28px; }
  .hero h1 { font-size: clamp(24px, 4.5vw, 34px); margin: 0 0 8px; letter-spacing: -0.01em; }
  .hero p { color: var(--text-2); margin: 0; }
  .hero p a { color: var(--primary); font-weight: 700; }
  .hero .file { margin-top: 10px; font-size: 13.5px; color: var(--text-3); }
  section { padding: 24px 0 64px; }
  section h2 { font-size: clamp(20px, 3.4vw, 26px); margin: 0 0 6px; }
  section p.sub { color: var(--text-2); margin: 0 0 24px; }
  /* 보안 경고 안내 */
  .warn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; align-items: start; }
  .warn-card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .warn-card .os { display: flex; align-items: baseline; gap: 8px; }
  .warn-card .os b { font-size: 17px; }
  .warn-card .os span { color: var(--text-3); font-size: 13px; }
  .warn-card .how { margin: 0; color: var(--text-2); font-size: 14px; }
  .warn-card .how .n { font-style: normal; display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 12px; margin-right: 4px; }
  .warn-card .how.muted { color: var(--text-3); font-size: 13px; }
  .mock { border-radius: 10px; padding: 14px 16px; font-size: 12.5px; line-height: 1.5; user-select: none; }
  .mock p { margin: 6px 0 0; }
  .mock .hl { outline: 2px solid #ffd43b; outline-offset: 3px; border-radius: 4px; animation: hl 1.6s ease-in-out infinite; }
  @keyframes hl { 50% { outline-color: rgba(255, 212, 59, 0.35); } }
  .smartscreen { background: #0a5fad; color: #fff; }
  .ss-title { font-size: 17px; font-weight: 300; }
  .ss-link { display: inline-block; margin-top: 8px; text-decoration: underline; }
  .ss-btns, .uac-btns, .mac-btns { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .ss-btn { padding: 4px 14px; border: 1px solid rgba(255, 255, 255, 0.8); }
  .uac { background: #f3f3f3; color: #1b1b1b; }
  .uac-top { font-size: 11.5px; color: #555; }
  .uac-q { font-weight: 600; font-size: 13.5px; }
  .uac-app { color: #333; }
  .uac-btn { flex: 1; text-align: center; padding: 5px; background: #e1e1e1; border-radius: 4px; }
  .uac-btn.hl { background: #0067c0; color: #fff; }
  .macalert { background: #ececec; color: #1d1d1f; text-align: center; }
  .mac-icon { width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; background: #f5b400; color: #fff; font-weight: 800; display: grid; place-items: center; }
  .macalert .small { font-size: 11.5px; color: #555; }
  .mac-btns { justify-content: center; }
  .mac-btn { padding: 4px 12px; background: #fff; border-radius: 5px; border: 1px solid #ccc; }
  .mac-btn.hl { background: #0a84ff; color: #fff; border-color: #0a84ff; }
  .cmd { display: flex; align-items: center; gap: 8px; background: #0b0c0f; border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 8px 12px; }
  .cmd code { flex: 1; min-width: 0; font-size: 12.5px; color: #9fe6b8; word-break: break-all; }
  .cmd button { flex: none; font: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 10px; border: 0; border-radius: 8px; background: var(--surface-2); color: var(--text); cursor: pointer; }
  .mac-dl { display: block; text-align: center; padding: 11px; border-radius: 12px; background: var(--surface-2); color: var(--text); font-weight: 700; text-decoration: none; }
  .mac-dl:hover { background: #2b2f38; }
  .mac-dl[hidden] { display: none; }

  footer { border-top: 1px solid var(--line); padding: 28px 0 44px; color: var(--text-3); font-size: 13px; }
  footer a { color: var(--text-2); }
  @media (max-width: 560px) { .wrap { padding: 0 16px; } .hero { padding: 40px 0 20px; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="home" href="/"><img src="icon.svg" alt="" />MC CubePanel</a>
  <div class="langs" id="langs"><button data-l="ko">한국어</button><button data-l="en">EN</button><button data-l="zh">中文</button></div>
</div></header>
<main class="wrap">
  <div class="hero">
    <div class="ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m0 0-5-5m5 5 5-5M5 20h14" /></svg></div>
    <h1 id="h-start" data-t="start"></h1>
    <p id="p-hint"><span data-t="hint"></span> <a id="again" href="https://github.com/rlaxodbs1723-prog/mc-server-manager/releases/latest" data-t="again"></a></p>
    <p class="file" id="file"></p>
  </div>
  <section>
    <h2 data-t="wh"></h2>
    <p class="sub" data-t="step"></p>
    <div class="warn-grid" id="cards">
      <div class="warn-card" data-os="win" data-t="win"></div>
      <div class="warn-card" data-os="win" data-t="upd"></div>
      <div class="warn-card" data-os="mac" data-t="mac"></div>
    </div>
  </section>
</main>
<footer><div class="wrap"><a href="/" data-t="back"></a> · <a href="/privacy">개인정보 처리방침</a></div></footer>
<script>
  const T = {"ko":{"title":"다운로드","start":"다운로드가 곧 시작돼요","hint":"시작되지 않으면","again":"여기를 눌러 주세요","mobile":"PC(윈도우·맥)에서 이 페이지를 열면 받을 수 있어요.","fail":"파일 정보를 불러오지 못했어요.","rel":"릴리스 페이지에서 받기","back":"처음으로","next":"다음은","step":"받은 파일을 실행하고, 아래 경고가 뜨면 그림처럼 눌러 주세요.","wh":"보안 경고가 뜨면","ws":"개인이 만든 무료 앱이라 처음 실행할 때 경고가 떠요. 앱의 코드는 깃허브에 모두 공개돼 있어요.","win":"<div class=\"os\"><b>윈도우</b><span>처음 설치할 때</span></div>\n      <div class=\"mock smartscreen\"><div class=\"ss-title\">Windows의 PC 보호</div><p>Microsoft Defender SmartScreen에서 인식할 수 없는 앱의 시작을 차단했습니다.</p><span class=\"ss-link hl\">추가 정보</span></div>\n      <p class=\"how\"><i class=\"n\">1</i> 파란 창에서 <b>추가 정보</b>를 눌러요</p>\n      <div class=\"mock smartscreen\"><div class=\"ss-title\">Windows의 PC 보호</div><p>앱: MC-CubePanel-Setup.exe<br>게시자: 알 수 없는 게시자</p><div class=\"ss-btns\"><span class=\"ss-btn hl\">실행</span><span class=\"ss-btn\">실행 안 함</span></div></div>\n      <p class=\"how\"><i class=\"n\">2</i> <b>실행</b>을 누르면 설치가 시작돼요</p>","upd":"<div class=\"os\"><b>윈도우</b><span>업데이트할 때</span></div>\n      <div class=\"mock uac\"><div class=\"uac-top\">사용자 계정 컨트롤</div><p class=\"uac-q\">게시자를 알 수 없는 이 앱이 디바이스를 변경할 수 있도록 허용하시겠어요?</p><p class=\"uac-app\">MC CubePanel Setup.exe</p><div class=\"uac-btns\"><span class=\"uac-btn hl\">예</span><span class=\"uac-btn\">아니요</span></div></div>\n      <p class=\"how\"><b>예</b>를 누르면 업데이트가 설치돼요. 앱을 \"모든 사용자\"용으로 설치했으면 업데이트 때마다 이 창이 떠요.</p>\n      <p class=\"how muted\">계속 다시 뜨면 위에서 설치 파일을 새로 받아 실행해 주세요. 서버와 월드는 그대로 남아요.</p>","mac":"<div class=\"os\"><b>맥</b><span>Apple 칩 · 시험판</span></div>\n      <div class=\"mock macalert\"><div class=\"mac-icon\">!</div><p><b>\"MC CubePanel\"이(가) 손상되었기 때문에 열 수 없습니다.</b></p><p class=\"small\">휴지통으로 이동해야 합니다.</p><div class=\"mac-btns\"><span class=\"mac-btn\">휴지통으로 이동</span><span class=\"mac-btn hl\">취소</span></div></div>\n      <p class=\"how\"><i class=\"n\">1</i> 이 창이 뜨면 <b>취소</b>를 누르고, 앱을 응용 프로그램 폴더로 옮겨요</p>\n      <p class=\"how\"><i class=\"n\">2</i> 터미널을 열고 아래를 붙여 넣은 뒤 Enter를 눌러요</p>\n      <div class=\"cmd\"><code>xattr -cr \"/Applications/MC CubePanel.app\"</code><button type=\"button\" data-copy='xattr -cr \"/Applications/MC CubePanel.app\"'>복사</button></div>\n      <p class=\"how\"><i class=\"n\">3</i> 앱을 다시 열면 돼요. 맥은 아직 시험 중이라 문제가 있으면 디스코드로 알려 주세요.</p>\n      <a class=\"mac-dl\" id=\"mac-dl\" hidden>맥 시험판 받기 (.dmg)</a>","copy2":"복사","copied2":"복사됨"},"en":{"title":"Download","start":"Your download will start shortly","hint":"If it doesn’t start,","again":"click here","mobile":"Open this page on a PC (Windows or Mac) to download.","fail":"Couldn’t load the file info.","rel":"Download from the releases page","back":"Home","next":"Next","step":"Run the downloaded file. If one of these warnings appears, click as shown.","wh":"If a security warning appears","ws":"This is a free app made by an individual, so a warning appears the first time. All of the app’s code is public on GitHub.","win":"<div class=\"os\"><b>Windows</b><span>First install</span></div>\n      <div class=\"mock smartscreen\"><div class=\"ss-title\">Windows protected your PC</div><p>Microsoft Defender SmartScreen prevented an unrecognized app from starting.</p><span class=\"ss-link hl\">More info</span></div>\n      <p class=\"how\"><i class=\"n\">1</i> Click <b>More info</b> in the blue window</p>\n      <div class=\"mock smartscreen\"><div class=\"ss-title\">Windows protected your PC</div><p>App: MC-CubePanel-Setup.exe<br>Publisher: Unknown publisher</p><div class=\"ss-btns\"><span class=\"ss-btn hl\">Run anyway</span><span class=\"ss-btn\">Don’t run</span></div></div>\n      <p class=\"how\"><i class=\"n\">2</i> Click <b>Run anyway</b> to start installing</p>","upd":"<div class=\"os\"><b>Windows</b><span>When updating</span></div>\n      <div class=\"mock uac\"><div class=\"uac-top\">User Account Control</div><p class=\"uac-q\">Do you want to allow this app from an unknown publisher to make changes to your device?</p><p class=\"uac-app\">MC CubePanel Setup.exe</p><div class=\"uac-btns\"><span class=\"uac-btn hl\">Yes</span><span class=\"uac-btn\">No</span></div></div>\n      <p class=\"how\">Click <b>Yes</b> to install the update. If you installed the app for all users, this window appears on every update.</p>\n      <p class=\"how muted\">If it keeps coming back, download the installer above and run it again. Your servers and worlds are kept.</p>","mac":"<div class=\"os\"><b>Mac</b><span>Apple silicon · Preview</span></div>\n      <div class=\"mock macalert\"><div class=\"mac-icon\">!</div><p><b>“MC CubePanel” is damaged and can’t be opened.</b></p><p class=\"small\">You should move it to the Trash.</p><div class=\"mac-btns\"><span class=\"mac-btn\">Move to Trash</span><span class=\"mac-btn hl\">Cancel</span></div></div>\n      <p class=\"how\"><i class=\"n\">1</i> Click <b>Cancel</b>, then move the app to the Applications folder</p>\n      <p class=\"how\"><i class=\"n\">2</i> Open Terminal, paste the line below and press Enter</p>\n      <div class=\"cmd\"><code>xattr -cr \"/Applications/MC CubePanel.app\"</code><button type=\"button\" data-copy='xattr -cr \"/Applications/MC CubePanel.app\"'>Copy</button></div>\n      <p class=\"how\"><i class=\"n\">3</i> Open the app again. The Mac version is still in testing, so please report problems on Discord.</p>\n      <a class=\"mac-dl\" id=\"mac-dl\" hidden>Download Mac preview (.dmg)</a>","copy2":"Copy","copied2":"Copied"},"zh":{"title":"下载","start":"即将开始下载","hint":"如果没有开始，","again":"请点击这里","mobile":"请在电脑（Windows 或 Mac）上打开此页面下载。","fail":"无法读取文件信息。","rel":"从发布页面下载","back":"首页","next":"接下来","step":"运行下载的文件，如果出现以下警告，请按图示点击。","wh":"出现安全警告时","ws":"这是个人开发的免费应用，第一次运行时会出现警告。应用的代码全部公开在 GitHub 上。","win":"<div class=\"os\"><b>Windows</b><span>首次安装</span></div>\n      <div class=\"mock smartscreen\"><div class=\"ss-title\">Windows 已保护你的电脑</div><p>Microsoft Defender SmartScreen 阻止了无法识别的应用启动。</p><span class=\"ss-link hl\">更多信息</span></div>\n      <p class=\"how\"><i class=\"n\">1</i> 在蓝色窗口中点击<b>更多信息</b></p>\n      <div class=\"mock smartscreen\"><div class=\"ss-title\">Windows 已保护你的电脑</div><p>应用：MC-CubePanel-Setup.exe<br>发布者：未知发布者</p><div class=\"ss-btns\"><span class=\"ss-btn hl\">仍要运行</span><span class=\"ss-btn\">不运行</span></div></div>\n      <p class=\"how\"><i class=\"n\">2</i> 点击<b>仍要运行</b>开始安装</p>","upd":"<div class=\"os\"><b>Windows</b><span>更新时</span></div>\n      <div class=\"mock uac\"><div class=\"uac-top\">用户账户控制</div><p class=\"uac-q\">你要允许此来自未知发布者的应用对你的设备进行更改吗？</p><p class=\"uac-app\">MC CubePanel Setup.exe</p><div class=\"uac-btns\"><span class=\"uac-btn hl\">是</span><span class=\"uac-btn\">否</span></div></div>\n      <p class=\"how\">点击<b>是</b>即可安装更新。如果安装时选择了\"所有用户\"，每次更新都会出现这个窗口。</p>\n      <p class=\"how muted\">如果反复出现，请在上方重新下载安装程序并运行。服务器和世界会保留。</p>","mac":"<div class=\"os\"><b>Mac</b><span>Apple 芯片 · 测试版</span></div>\n      <div class=\"mock macalert\"><div class=\"mac-icon\">!</div><p><b>“MC CubePanel”已损坏，无法打开。</b></p><p class=\"small\">你应该将它移到废纸篓。</p><div class=\"mac-btns\"><span class=\"mac-btn\">移到废纸篓</span><span class=\"mac-btn hl\">取消</span></div></div>\n      <p class=\"how\"><i class=\"n\">1</i> 点击<b>取消</b>，然后把应用移到\"应用程序\"文件夹</p>\n      <p class=\"how\"><i class=\"n\">2</i> 打开终端，粘贴下面这行并按回车</p>\n      <div class=\"cmd\"><code>xattr -cr \"/Applications/MC CubePanel.app\"</code><button type=\"button\" data-copy='xattr -cr \"/Applications/MC CubePanel.app\"'>复制</button></div>\n      <p class=\"how\"><i class=\"n\">3</i> 再次打开应用即可。Mac 版本仍在测试中，有问题请在 Discord 告诉我们。</p>\n      <a class=\"mac-dl\" id=\"mac-dl\" hidden>下载 Mac 测试版 (.dmg)</a>","copy2":"复制","copied2":"已复制"}}
  let lang = 'ko'
  let file = null // { url, name, mb, version }
  let failed = false
  const isMac = /Mac/i.test(navigator.platform || navigator.userAgent) && !/iPhone|iPad/i.test(navigator.userAgent)
  const isMobile = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent)

  function render() {
    const t = T[lang]
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang
    document.querySelectorAll('[data-t]').forEach((el) => (el.innerHTML = t[el.dataset.t] ?? ''))
    document.querySelectorAll('#langs button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang))
    if (isMobile) {
      document.getElementById('h-start').textContent = t.title
      document.getElementById('p-hint').textContent = t.mobile
    } else if (failed) {
      document.getElementById('h-start').textContent = t.fail
      document.getElementById('p-hint').innerHTML = '<a href="https://github.com/rlaxodbs1723-prog/mc-server-manager/releases/latest">' + t.rel + '</a>'
    }
    if (file) {
      document.getElementById('again').href = file.url
      document.getElementById('file').textContent = file.name + ' · ' + file.mb + 'MB · v' + file.version
    }
    // 맥이면 맥 안내를 맨 앞에
    const cards = document.getElementById('cards')
    const mac = cards.querySelector('[data-os="mac"]')
    if (isMac) cards.prepend(mac)
    // 맥 안내 안의 "맥 시험판 받기" 버튼은 이 페이지에서는 필요 없다 (위에서 이미 받는다)
    const extra = document.getElementById('mac-dl')
    if (extra) extra.remove()
    document.title = t.title + ' - MC CubePanel'
  }

  document.getElementById('langs').addEventListener('click', (e) => {
    const b = e.target.closest('button')
    if (!b) return
    lang = b.dataset.l
    try { localStorage.setItem('lang', lang) } catch {}
    render()
  })
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]')
    if (!b) return
    navigator.clipboard?.writeText(b.dataset.copy).then(() => {
      b.textContent = T[lang].copied2
      setTimeout(() => (b.textContent = T[lang].copy2), 1500)
    })
  })

  let saved = null
  try { saved = localStorage.getItem('lang') } catch {}
  const nav = (navigator.language || '').toLowerCase()
  lang = T[saved] ? saved : nav.startsWith('ko') ? 'ko' : nav.startsWith('zh') ? 'zh' : 'en'
  render()

  // 최신 릴리스에서 이 컴퓨터에 맞는 파일을 찾아 바로 받기 시작한다
  ;(async () => {
    try {
      const res = await fetch('https://api.github.com/repos/rlaxodbs1723-prog/mc-server-manager/releases/latest')
      if (!res.ok) throw new Error(String(res.status))
      const r = await res.json()
      const assets = r.assets || []
      const a = (isMac && assets.find((x) => /\.dmg$/i.test(x.name))) || assets.find((x) => /\.exe$/i.test(x.name))
      if (!a) throw new Error('no file')
      file = { url: a.browser_download_url, name: a.name, mb: Math.round(a.size / 1048576), version: r.tag_name.replace(/^v/, '') }
      render()
      if (!isMobile) setTimeout(() => (location.href = file.url), 400)
    } catch {
      failed = true
      render()
    }
  })()
</script>
<script data-goatcounter="https://cubepanel.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
