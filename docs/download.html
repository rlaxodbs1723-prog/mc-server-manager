    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang
    document.querySelectorAll('[data-t]').forEach((el) => (el.innerHTML = t[el.dataset.t] ?? ''))
    document.querySelectorAll('#langs button').forEach((b) => b.classList.toggle('on', b.dataset.l === lang))
    for (const os of ['win', 'mac']) {
      const m = files[os]
      document.getElementById(os + '-meta').textContent = m ? 'v' + m.version + ' · ' + m.mb + 'MB' : ''
    }
    const note = document.getElementById('note')
    note.hidden = !(isMobile || failed)
    if (isMobile) note.textContent = t.mobile
    else if (failed) note.innerHTML = t.fail + ' <a href="https://github.com/rlaxodbs1723-prog/mc-server-manager/releases/latest">' + t.rel + '</a>'
    // 고른 쪽의 안내만 보여 준다
    document.getElementById('guide').hidden = !chosen
    document.querySelectorAll('#cards .warn-card').forEach((c) => (c.hidden = c.dataset.os !== chosen))
    document.querySelectorAll('.os-btn').forEach((b) => b.classList.toggle('on', b.dataset.os === chosen))
    if (chosen && files[chosen]) document.getElementById('again').href = files[chosen].url
    const extra = document.getElementById('mac-dl')
    if (extra) extra.remove()
    document.title = t.title + ' - MC CubePanel'
  }

  document.getElementById('pick').addEventListener('click', (e) => {
    const b = e.target.closest('.os-btn')
    if (!b) return
    chosen = b.dataset.os
    const file = files[chosen]
    document.getElementById('started').hidden = isMobile || !file
    render()
    if (file && !isMobile) location.href = file.url
    else if (!file) location.href = 'https://github.com/rlaxodbs1723-prog/mc-server-manager/releases/latest'
    document.getElementById('guide').scrollIntoView({ behavior: 'smooth', block: 'start' })
  })
  document.getElementById('langs').addEventListener('click', (e) => {
    const b = e.target.closest('button')
    if (!b) return
    lang = b.dataset.l
    try { localStorage.setItem('lang', lang) } catch {}
    render()
  })
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-copy]')
    if (!b) return
    navigator.clipboard?.writeText(b.dataset.copy).then(() => {
      b.textContent = T[lang].copied2
      setTimeout(() => (b.textContent = T[lang].copy2), 1500)
    })
  })

  let saved = null
  try { saved = localStorage.getItem('lang') } catch {}
  const nav = (navigator.language || '').toLowerCase()
  lang = T[saved] ? saved : nav.startsWith('ko') ? 'ko' : nav.startsWith('zh') ? 'zh' : 'en'
  render()

  // 최신 릴리스에서 윈도우(exe)·맥(dmg) 파일을 찾아 둔다
  ;(async () => {
    try {
      const res = await fetch('https://api.github.com/repos/rlaxodbs1723-prog/mc-server-manager/releases/latest')
      if (!res.ok) throw new Error(String(res.status))
      const r = await res.json()
      const version = r.tag_name.replace(/^v/, '')
      for (const [os, re] of [['win', /\.exe$/i], ['mac', /\.dmg$/i]]) {
        const a = (r.assets || []).find((x) => re.test(x.name))
        if (a) files[os] = { url: a.browser_download_url, name: a.name, mb: Math.round(a.size / 1048576), version }
      }
      if (!files.win && !files.mac) throw new Error('no file')
    } catch {
      failed = true
    }
    render()
  })()
</script>
<script data-goatcounter="https://cubepanel.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
