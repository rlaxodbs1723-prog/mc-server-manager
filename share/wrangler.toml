# 서버 공유 중계 (Cloudflare Worker + Durable Object). 배포: share 폴더에서 npx wrangler deploy
# 사이트(Pages)와 따로 올라가고, cubepanel.kr/api/share/* 주소만 이 Worker가 받는다 (DNS 기록을 새로 쓰지 않으려고 경로로 붙인다)
name = "cubepanel-share"
main = "worker.mjs"
compatibility_date = "2025-06-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "ShareRoom"

# 무료 요금제는 SQLite 저장소를 쓰는 Durable Object만 만들 수 있다
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ShareRoom"]

[[routes]]
pattern = "cubepanel.kr/api/share/*"
zone_name = "cubepanel.kr"
